server.port=${PORT:8081}
server.error.include-message=always

# ---------- MySQL ----------
# En local (docker compose up -d) : utilisateur root / mot de passe root => export DB_PASSWORD=root
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferme_lapins?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Sécurité ----------
# La valeur par défaut sert uniquement au développement : définir JWT_SECRET en production (32 caractères minimum)
app.jwt.secret=${JWT_SECRET:ferme-lapins-dev-secret-a-changer-en-production-0123456789}
app.jwt.hours=72
app.cors.origins=${CORS_ORIGINS:*}

management.endpoints.web.exposure.include=health
