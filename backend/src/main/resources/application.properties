server.port=${PORT:8081}
server.error.include-message=always

# ---------- PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ferme_lapins}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Sécurité ----------
# La valeur par défaut sert uniquement au développement : définir JWT_SECRET en production (32 caractères minimum)
app.jwt.secret=${JWT_SECRET:ferme-lapins-dev-secret-a-changer-en-production-0123456789}
app.jwt.hours=72
app.cors.origins=${CORS_ORIGINS:*}

management.endpoints.web.exposure.include=health
