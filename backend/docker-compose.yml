# PostgreSQL local : docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: ferme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferme_lapins
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
